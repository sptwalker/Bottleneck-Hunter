name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Syntax / docs / encoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 语法：整个包必须能编译。这是最低成本的"语法错误不合并"门。
      - name: Compile check
        run: |
          python -m compileall -q bottleneck_hunter scripts
          python -m py_compile bottleneck_hunter/cli.py

      # 文档：相对链接必须能解析、代码围栏必须配平。
      - name: Documentation links
        run: python scripts/check_docs.py

      # 编码：U+FFFD / 私用区 / GBK 乱码指纹。中文项目刚需。
      - name: Encoding pollution
        run: python scripts/check_mojibake.py

      # CLAUDE.md / AGENTS.md 的路径引用必须存在——它是每次会话最被信任的输入。
      # 这里**不跑 pytest**：本 job 刻意不装项目依赖以保持轻量，而 tests/conftest.py
      # 会在收集阶段 import bottleneck_hunter.watchlist.news_pipeline，
      # 缺依赖时所有测试直接 ERROR（不是断言失败，日志里看不出原因）。
      # 改为直接调用校验函数——同样的判据，零依赖。完整测试由 tests job 覆盖。
      - name: Agent instruction references
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tests")
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "agents_refs", Path("tests/test_agents_md_references.py")
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          missing = {}
          for name in mod.DOCUMENTS:
              doc = mod.REPO_ROOT / name
              assert doc.is_file(), f"{name} missing"
              gaps = mod.missing_references(doc)
              if gaps:
                  missing[name] = gaps
          if missing:
              for name, gaps in missing.items():
                  for g in gaps:
                      print(f"::error file={name}::{g} 不存在")
              sys.exit(1)
          print(f"agent instruction references OK ({', '.join(mod.DOCUMENTS)})")
          PY

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # 阻断级：真正的错误（未定义名、语法、死代码路径）
      - name: Ruff (blocking)
        run: ruff check . --select E9,F63,F7,F82
      # 报告级：现有代码尚有大量风格问题，先出统计不阻断，避免一次格式化淹没真改动
      - name: Ruff (report only)
        run: ruff check . --statistics || true

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # 与生产 Dockerfile 保持一致：装 .[datasources]（finnhub/efinance/pytdx）。
          # 只装 `-e .` 会让依赖 finnhub 的代码路径在 CI 里 ModuleNotFoundError，
          # 而生产镜像里是有的 —— CI 与生产不一致就等于没在测生产。
          pip install -e ".[datasources]"
          pip install pytest pytest-asyncio pytest-timeout

      # 不跑 slow：那些是真实网络/外部依赖（akshare、yfinance 等），CI 里不稳定也无意义
      # -rf 让失败用例在尾部汇总列出；--tb=short 保证日志里看得到断言而不是被截断
      - name: Pytest
        id: pytest
        run: |
          set -o pipefail
          python -m pytest tests/ -q -rf --tb=short -m "not slow" --timeout=300 2>&1 | tee pytest.log

      # 失败时把每个 FAILED/ERROR 用例名提升为 check-run annotation。
      # 理由：job 日志需要 admin 权限才能下载，annotation 是公开可读的
      # （GET /commits/{sha}/check-runs → annotations），外部协作者也能直接看到失败点。
      - name: Annotate failures
        if: failure()
        run: |
          python - <<'PY'
          import pathlib, re
          log = pathlib.Path("pytest.log")
          if not log.exists():
              print("::error::pytest.log missing")
              raise SystemExit(0)
          lines = [l for l in log.read_text(errors="replace").splitlines()
                   if re.match(r"^(FAILED|ERROR)\s", l)]
          for line in lines[:200]:
              print(f"::error::{line[:220]}")
          print(f"::error::{len(lines)} failing/erroring test(s)")
          PY
